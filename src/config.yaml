site:
  name: MPowerBoards
  site: 'https://mpowerboards.com'
  base: '/'
  trailingSlash: false

# Default SEO metadata
metadata:
  title:
    default: MPowerBoards
    template: '%s — MPowerBoards'
  description: 'Interactive physical boards that turn power-grid simulations into real-time, hands-on visualizations for classrooms and research.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: MPowerBoards
    images:
      - url: '~/assets/images/mpb/logo.png'
        width: 974
        height: 334
    type: website

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
